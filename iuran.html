<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iuran · KasKita</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/kaskita.css"></head>
<body data-page="iuran"><div class="content"><div class="head"><div><h1>Iuran</h1><p>Tagihan iuran anggota, bukti pembayaran, dan verifikasi.</p></div>
<div class="head-actions" id="aksiB"><select id="periode" class="sel" aria-label="Periode"></select><button class="btn ghost" id="unduh">Ekspor CSV</button><button class="btn" id="buat">+ Buat tagihan</button></div></div>
<div id="viewB"><div class="stats" id="stats"></div><div class="card"><div class="tools"><input id="q" placeholder="Cari nama anggota" aria-label="Cari"><select id="st" aria-label="Status"><option value="">Semua status</option><option value="belum">Belum bayar</option><option value="menunggu">Menunggu verifikasi</option><option value="lunas">Lunas</option></select></div><div class="wrap"><table><thead><tr><th>Anggota</th><th>Bulan</th><th>Nominal</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<div id="viewA"><div class="card" style="margin-bottom:16px"><h3>Cara pembayaran</h3><p id="info" class="info"></p></div><div class="card"><h3>Tagihan iuranmu</h3><div class="wrap"><table><thead><tr><th>Bulan</th><th>Nominal</th><th>Status</th><th></th></tr></thead><tbody id="rowsA"></tbody></table></div></div></div>
<dialog id="dlgTagihan"><form id="fTagihan"><h3>Buat tagihan iuran</h3><label class="field">Bulan<select name="bulan"></select></label><label class="field">Nominal per anggota (Rp)<input type="number" name="nominal" min="1" step="1" required></label><p class="info" id="tgInfo"></p><div class="row"><button type="button" class="btn ghost" id="tgBatal">Batal</button><button class="btn">Buat tagihan</button></div></form></dialog>
<dialog id="dlgBukti" class="lebar"><h3>Periksa bukti pembayaran</h3><p class="info" id="bInfo"></p><img id="bImg" alt="Bukti pembayaran"><label class="field">Alasan (diisi jika ditolak)<input id="alasan" placeholder="Contoh: nominal tidak sesuai"></label><div class="row"><button type="button" class="btn ghost" id="bTutup">Tutup</button><button type="button" class="btn danger" id="bTolak">Tolak</button><button type="button" class="btn" id="bSetuju">Setujui</button></div></dialog>
<dialog id="dlgUp"><form id="fUp"><h3>Upload bukti pembayaran</h3><p class="info" id="upInfo"></p><label class="field">Foto atau tangkapan layar bukti transfer<input type="file" name="bukti" accept="image/*" required></label><div class="row"><button type="button" class="btn ghost" id="upBatal">Batal</button><button class="btn">Kirim bukti</button></div></form></dialog>
<dialog id="dlgK"><h3 id="kJudul"></h3><p class="info" id="kInfo"></p><div class="row"><button type="button" class="btn ghost" id="kBatal">Batal</button><button type="button" class="btn danger" id="kYa">Ya</button></div></dialog>
<dialog id="dlgImg" class="lebar"><h3 id="imgJudul"></h3><img id="imgView" alt="Lampiran"><div class="row"><button type="button" class="btn ghost" id="imgTutup">Tutup</button></div></dialog>
</div><script src="js/kaskita.js"></script></body></html>

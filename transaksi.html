<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar transaksi · KasKita</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body data-page="transaksi"><div class="content"><div class="head"><div><h1>Daftar transaksi</h1><p>Semua uang masuk dan keluar organisasi.</p></div><button class="btn" id="tambah">+ Tambah transaksi</button></div><div class="card"><div class="tools"><input id="q" placeholder="Cari keterangan transaksi" aria-label="Cari"><select id="tipe" aria-label="Jenis"><option value="">Semua jenis</option><option value="masuk">Pemasukan</option><option value="keluar">Pengeluaran</option></select></div><div class="wrap"><table><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Kategori</th><th>Jenis</th><th>Jumlah</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div>
<dialog id="dlg"><form id="form"><h3>Catat transaksi</h3><label class="field">Jenis<select name="tipe"><option value="masuk">Pemasukan</option><option value="keluar">Pengeluaran</option></select></label><label class="field">Tanggal<input type="date" name="tgl" required></label><label class="field">Keterangan<input name="ket" placeholder="Contoh: Konsumsi rapat" required></label><label class="field">Kategori<select name="kat"><option>Iuran</option><option>Donasi</option><option>Acara</option><option>Perlengkapan</option></select></label><label class="field">Jumlah (Rp)<input type="number" name="jml" min="1" required></label><div class="row"><button type="button" class="btn ghost" id="batal">Batal</button><button class="btn">Simpan transaksi</button></div></form></dialog></div><script src="app.js"></script></body></html>

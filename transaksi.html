<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar transaksi · KasKita</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/kaskita.css"></head>
<body data-page="transaksi"><div class="content"><div class="head"><div><h1>Daftar transaksi</h1><p>Semua uang masuk dan keluar organisasi.</p></div><div class="head-actions"><button class="btn ghost" id="unduh">Ekspor CSV</button><button class="btn" id="tambah">+ Tambah transaksi</button></div></div><div class="card"><div class="tools"><input id="q" placeholder="Cari keterangan transaksi" aria-label="Cari"><select id="tipe" aria-label="Jenis"><option value="">Semua jenis</option><option value="masuk">Pemasukan</option><option value="keluar">Pengeluaran</option></select><select id="fkat" aria-label="Kategori"></select><label class="dt">Dari <input type="date" id="dari"></label><label class="dt">Sampai <input type="date" id="sampai"></label><button type="button" class="btn ghost" id="reset">Atur ulang</button></div><div class="wrap"><table><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Kategori</th><th>Jenis</th><th>Jumlah</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><p class="ringkas" id="ringkas"></p></div>
<dialog id="dlg"><form id="form"><h3 id="jdl">Catat transaksi</h3><label class="field">Jenis<select name="tipe"><option value="masuk">Pemasukan</option><option value="keluar">Pengeluaran</option></select></label><label class="field">Tanggal<input type="date" name="tgl" required></label><label class="field">Keterangan<input name="ket" placeholder="Contoh: Konsumsi rapat" required></label><label class="field">Kategori<select name="kat"></select></label><label class="field">Jumlah (Rp)<input type="number" name="jml" min="1" step="1" required></label><label class="field">Lampiran nota (opsional, gambar)<input type="file" name="nota" accept="image/*"></label><label class="chk" id="notaAda" hidden><input type="checkbox" name="hapusNota"> Hapus lampiran yang sudah ada (atau pilih gambar baru untuk menggantinya)</label><div class="row"><button type="button" class="btn ghost" id="batal">Batal</button><button class="btn" id="simpan">Simpan transaksi</button></div></form></dialog>
<dialog id="dlgHapus"><h3>Hapus transaksi ini?</h3><p class="info" id="hapusInfo"></p><p class="info">Transaksi yang dihapus tidak bisa dikembalikan.</p><div class="row"><button type="button" class="btn ghost" id="hapusBatal">Batal</button><button type="button" class="btn danger" id="hapusYa">Ya, hapus</button></div></dialog>
<dialog id="dlgK"><h3 id="kJudul"></h3><p class="info" id="kInfo"></p><div class="row"><button type="button" class="btn ghost" id="kBatal">Batal</button><button type="button" class="btn danger" id="kYa">Ya</button></div></dialog>
<dialog id="dlgImg" class="lebar"><h3 id="imgJudul"></h3><img id="imgView" alt="Lampiran"><div class="row"><button type="button" class="btn ghost" id="imgTutup">Tutup</button></div></dialog>
</div><script src="js/kaskita.js"></script></body></html>

<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anggota · KasKita</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/kaskita.css"></head>
<body data-page="anggota"><div class="content"><div class="head"><div><h1>Anggota</h1><p>Daftar anggota yang ditagih iuran.</p></div><div class="head-actions"><button class="btn" id="tambah">+ Tambah anggota</button></div></div><div class="card"><div class="tools"><input id="q" placeholder="Cari nama atau email" aria-label="Cari"></div><div class="wrap"><table><thead><tr><th>Nama</th><th>Email</th><th>Telepon</th><th>Status</th><th>Iuran</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><p class="ringkas" id="ringkas"></p></div>
<dialog id="dlg"><form id="form"><h3 id="jdl">Tambah anggota</h3><label class="field">Nama lengkap<input name="nama" required></label><label class="field">Email (opsional)<input name="email" type="email" placeholder="nama@organisasi.id"></label><small class="hint">Jika anggota mendaftar akun dengan email ini, akunnya otomatis terhubung dan ia bisa melihat tagihannya sendiri.</small><label class="field">Telepon (opsional)<input name="telp" inputmode="tel"></label><label class="chk"><input type="checkbox" name="aktif" checked> Anggota aktif (ikut ditagih iuran)</label><div class="row"><button type="button" class="btn ghost" id="batal">Batal</button><button class="btn">Simpan</button></div></form></dialog>
<dialog id="dlgK"><h3 id="kJudul"></h3><p class="info" id="kInfo"></p><div class="row"><button type="button" class="btn ghost" id="kBatal">Batal</button><button type="button" class="btn danger" id="kYa">Ya</button></div></dialog>
<dialog id="dlgImg" class="lebar"><h3 id="imgJudul"></h3><img id="imgView" alt="Lampiran"><div class="row"><button type="button" class="btn ghost" id="imgTutup">Tutup</button></div></dialog>
</div><script src="js/kaskita.js"></script></body></html>

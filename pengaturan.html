<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pengaturan · KasKita</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/kaskita.css"></head>
<body data-page="pengaturan"><div class="content"><div class="head"><div><h1>Pengaturan</h1><p>Saldo awal, iuran, dan kategori kas.</p></div></div>
<div class="grid2 sama"><div class="card"><h3>Kas dan iuran</h3><form id="fSet"><label class="field">Saldo awal kas (Rp)<input type="number" name="saldoAwal" min="0" step="1" placeholder="0"></label><label class="field">Nominal iuran standar per bulan (Rp)<input type="number" name="iuran" min="0" step="1" placeholder="0"></label><label class="field">Info pembayaran untuk anggota<textarea name="infoBayar" rows="3" maxlength="300" placeholder="Contoh: Transfer ke BSI 1234567890 a.n. Bendahara HMIF"></textarea></label><button class="btn">Simpan pengaturan</button></form></div>
<div class="card"><h3>Kategori transaksi</h3><div id="kats"></div><form id="fKat" class="tools" style="margin:14px 0 0"><input id="kBaru" placeholder="Kategori baru, mis. Konsumsi" maxlength="30" aria-label="Kategori baru"><button class="btn">Tambah</button></form></div></div>
<dialog id="dlgK"><h3 id="kJudul"></h3><p class="info" id="kInfo"></p><div class="row"><button type="button" class="btn ghost" id="kBatal">Batal</button><button type="button" class="btn danger" id="kYa">Ya</button></div></dialog>
<dialog id="dlgImg" class="lebar"><h3 id="imgJudul"></h3><img id="imgView" alt="Lampiran"><div class="row"><button type="button" class="btn ghost" id="imgTutup">Tutup</button></div></dialog>
</div><script src="js/kaskita.js"></script></body></html>
